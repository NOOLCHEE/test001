<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>숫자의 정원 | 스도쿠</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&family=Manrope:wght@500;600;700;800&display=swap');

		:root {
			--ink: #25343a;
			--muted: #718087;
			--paper: #f7f5ef;
			--panel: #fffdf8;
			--line: #d7e0de;
			--line-strong: #9fb5b4;
			--mint: #d8eee4;
			--mint-strong: #4b9d80;
			--coral: #e48672;
			--coral-soft: #fae4dc;
			--gold: #e9b85e;
			--shadow: 0 24px 70px rgba(39, 62, 61, .12);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-width: 320px;
			color: var(--ink);
			background: var(--paper);
			font-family: Manrope, sans-serif;
		}
		body::before {
			position: fixed;
			inset: 0;
			z-index: -1;
			pointer-events: none;
			content: "";
			opacity: .32;
			background-image: linear-gradient(rgba(110, 142, 137, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(110, 142, 137, .08) 1px, transparent 1px);
			background-size: 34px 34px;
			mask-image: linear-gradient(to bottom, black, transparent 70%);
		}
		button, select { font: inherit; }
		button { cursor: pointer; }
		.page { max-width: 1180px; margin: 0 auto; padding: 42px 28px 56px; }
		.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
		.brand { display: flex; align-items: center; gap: 14px; }
		.brand-mark { display: grid; width: 47px; height: 47px; place-items: center; color: var(--ink); background: var(--mint); border: 1px solid #b6d9cd; border-radius: 15px 15px 15px 4px; font-family: 'Gowun Batang', serif; font-size: 25px; box-shadow: 5px 5px 0 #c3e3d7; }
		.eyebrow { margin: 0 0 3px; color: var(--mint-strong); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
		h1 { margin: 0; font-family: 'Gowun Batang', serif; font-size: clamp(28px, 4vw, 42px); line-height: 1; letter-spacing: -.06em; }
		.top-actions { display: flex; gap: 9px; }
		.icon-button, .outline-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 15px; color: var(--ink); background: rgba(255, 253, 248, .7); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 800; transition: .2s ease; }
		.icon-button:hover, .outline-button:hover { border-color: var(--mint-strong); background: white; transform: translateY(-1px); }
		.layout { display: grid; grid-template-columns: minmax(0, 720px) 300px; gap: 30px; align-items: start; }
		.game-panel { padding: 25px; background: rgba(255, 253, 248, .84); border: 1px solid rgba(159, 181, 180, .55); border-radius: 22px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
		.game-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
		.game-head h2 { margin: 0; font-family: 'Gowun Batang', serif; font-size: 23px; }
		.game-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
		.difficulty { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 800; }
		select { height: 37px; padding: 0 29px 0 11px; color: var(--ink); background: var(--mint); border: 0; border-radius: 8px; font-size: 12px; font-weight: 800; outline: 0; }
		.board-wrap { max-width: 600px; margin: 0 auto; }
		.board { display: grid; grid-template-columns: repeat(9, 1fr); aspect-ratio: 1; overflow: hidden; border: 2px solid var(--ink); border-radius: 10px; background: var(--line); }
		.cell { position: relative; display: grid; place-items: center; min-width: 0; color: var(--ink); background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: 'DM Mono', monospace; font-size: clamp(17px, 3.3vw, 29px); font-weight: 500; transition: background .15s, color .15s; }
		.cell:nth-child(3n) { border-right: 2px solid var(--line-strong); }
		.cell:nth-child(9n) { border-right: 0; }
		.cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--line-strong); }
		.cell:nth-child(n+73) { border-bottom: 0; }
		.cell.given { font-weight: 700; }
		.cell.selected { background: var(--mint); }
		.cell.related { background: #eef6f1; }
		.cell.same-number { color: var(--mint-strong); background: #e0f0e8; }
		.cell.error { color: #bd5e4d; background: var(--coral-soft); }
		.cell:focus-visible { z-index: 1; outline: 3px solid var(--gold); outline-offset: -3px; }
		.cell .notes { position: absolute; inset: 7px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; justify-items: center; color: var(--muted); font-family: 'DM Mono', monospace; font-size: clamp(7px, 1.5vw, 12px); }
		.cell .notes span.active { color: var(--mint-strong); font-weight: 700; }
		.status-row { display: flex; align-items: center; justify-content: space-between; margin: 18px 1px 0; }
		.stats { display: flex; gap: 21px; }
		.stat { display: grid; gap: 2px; }
		.stat-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
		.stat-value { font-family: 'DM Mono', monospace; font-size: 16px; }
		.message { min-height: 20px; color: var(--muted); font-size: 12px; text-align: right; }
		.message.alert { color: var(--coral); font-weight: 800; }
		.message.success { color: var(--mint-strong); font-weight: 800; }
		.side { display: grid; gap: 18px; }
		.side-card { padding: 21px; background: rgba(255, 253, 248, .72); border-bottom: 2px solid #c3d9d1; border-radius: 16px; }
		.side-card h3 { margin: 0 0 16px; font-family: 'Gowun Batang', serif; font-size: 17px; }
		.number-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
		.number { display: grid; height: 51px; place-items: center; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 9px; font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; transition: .15s ease; }
		.number:hover { color: var(--mint-strong); border-color: var(--mint-strong); background: var(--mint); }
		.number:active { transform: scale(.95); }
		.tool-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
		.tool { height: 37px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; font-size: 11px; font-weight: 800; }
		.tool.active, .tool:hover { color: var(--ink); border-color: var(--gold); background: #fff7e4; }
		.tip { display: flex; gap: 10px; color: var(--muted); font-size: 11px; line-height: 1.7; }
		.tip strong { color: var(--ink); }
		.tip-icon { flex: 0 0 23px; display: grid; width: 23px; height: 23px; place-items: center; color: #9d7120; background: #fff0c9; border-radius: 50%; font-size: 12px; }
		.reset { width: 100%; margin-top: 15px; color: var(--coral); background: transparent; border: 0; font-size: 11px; font-weight: 800; }
		.reset:hover { text-decoration: underline; }
		@media (max-width: 820px) {
			.page { padding: 26px 16px 40px; }
			.layout { grid-template-columns: 1fr; gap: 18px; }
			.side { grid-template-columns: 1fr 1fr; }
			.side-card:last-child { grid-column: 1 / -1; }
		}
		@media (max-width: 520px) {
			.topbar { align-items: flex-start; flex-direction: column; margin-bottom: 22px; }
			.top-actions { width: 100%; }
			.top-actions button { flex: 1; }
			.game-panel { padding: 15px; border-radius: 16px; }
			.game-head { align-items: flex-start; flex-direction: column; gap: 12px; }
			.difficulty { width: 100%; justify-content: space-between; }
			.difficulty select { flex: 1; }
			.side { grid-template-columns: 1fr; }
			.side-card:last-child { grid-column: auto; }
			.status-row { align-items: flex-start; flex-direction: column; gap: 10px; }
			.message { text-align: left; }
		}
	</style>
</head>
<body>
	<main class="page">
		<header class="topbar">
			<div class="brand">
				<div class="brand-mark" aria-hidden="true">9</div>
				<div><p class="eyebrow">A QUIET MOMENT</p><h1>숫자의 정원</h1></div>
			</div>
			<div class="top-actions">
				<button class="outline-button" id="newGame" type="button">↻ 새 게임</button>
				<button class="icon-button" id="checkGame" type="button">✓ 확인하기</button>
			</div>
		</header>

		<div class="layout">
			<section class="game-panel" aria-label="스도쿠 게임">
				<div class="game-head">
					<div><h2>오늘의 퍼즐</h2><p>빈칸을 채워 아홉 개의 정원을 완성하세요.</p></div>
					<label class="difficulty">난이도 <select id="difficulty"><option value="easy">느긋하게</option><option value="medium" selected>알맞게</option><option value="hard">깊게</option></select></label>
				</div>
				<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="스도쿠 보드"></div></div>
				<div class="status-row">
					<div class="stats"><div class="stat"><span class="stat-label">시간</span><span class="stat-value" id="timer">00:00</span></div><div class="stat"><span class="stat-label">실수</span><span class="stat-value" id="mistakes">0 / 3</span></div></div>
					<div class="message" id="message" aria-live="polite">칸을 선택하고 숫자를 눌러보세요.</div>
				</div>
			</section>

			<aside class="side">
				<section class="side-card"><h3>숫자 입력</h3><div class="number-pad" id="numberPad"></div><div class="tool-row"><button class="tool" id="noteMode" type="button">✎ 메모 모드</button><button class="tool" id="erase" type="button">⌫ 지우기</button></div></section>
				<section class="side-card"><h3>작은 힌트</h3><div class="tip"><span class="tip-icon">i</span><span><strong>같은 숫자</strong>는 한 줄, 한 칸, 한 구역에 한 번만 나타나요.</span></div><button class="reset" id="hint" type="button">힌트 하나 받기 · 3회</button></section>
			</aside>
		</div>
	</main>

	<script>
		const boardElement = document.getElementById('board');
		const padElement = document.getElementById('numberPad');
		const messageElement = document.getElementById('message');
		const timerElement = document.getElementById('timer');
		const mistakesElement = document.getElementById('mistakes');
		const difficultyElement = document.getElementById('difficulty');
		const size = 9;
		let solution = [];
		let puzzle = [];
		let entries = [];
		let notes = [];
		let selected = null;
		let mistakes = 0;
		let hints = 3;
		let seconds = 0;
		let timerId = null;
		let noteMode = false;

		function shuffled(values) {
			return [...values].sort(() => Math.random() - .5);
		}
		function pattern(row, column) { return (row * 3 + Math.floor(row / 3) + column) % size; }
		function makeSolution() {
			const rows = shuffled([0, 1, 2]).flatMap(group => shuffled([0, 1, 2]).map(row => group * 3 + row));
			const columns = shuffled([0, 1, 2]).flatMap(group => shuffled([0, 1, 2]).map(column => group * 3 + column));
			const numbers = shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9]);
			return rows.map(row => columns.map(column => numbers[pattern(row, column)]));
		}
		function makePuzzle(level) {
			const blanks = { easy: 39, medium: 48, hard: 55 }[level];
			const result = solution.map(row => [...row]);
			shuffled(Array.from({ length: 81 }, (_, index) => index)).slice(0, blanks).forEach(index => { result[Math.floor(index / 9)][index % 9] = 0; });
			return result;
		}
		function startGame() {
			solution = makeSolution();
			puzzle = makePuzzle(difficultyElement.value);
			entries = puzzle.map(row => [...row]);
			notes = Array.from({ length: 81 }, () => new Set());
			selected = null; mistakes = 0; hints = 3; seconds = 0; noteMode = false;
			document.getElementById('noteMode').classList.remove('active');
			clearInterval(timerId); timerId = setInterval(() => { seconds++; renderTimer(); }, 1000);
			setMessage('칸을 선택하고 숫자를 눌러보세요.');
			render();
		}
		function renderTimer() { timerElement.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`; }
		function setMessage(text, type = '') { messageElement.textContent = text; messageElement.className = `message ${type}`; }
		function render() {
			boardElement.innerHTML = '';
			const selectedValue = selected === null ? 0 : entries[Math.floor(selected / 9)][selected % 9];
			for (let index = 0; index < 81; index++) {
				const row = Math.floor(index / 9); const column = index % 9;
				const cell = document.createElement('button');
				const value = entries[row][column];
				cell.className = 'cell'; cell.type = 'button'; cell.setAttribute('role', 'gridcell'); cell.dataset.index = index;
				cell.setAttribute('aria-label', `${row + 1}행 ${column + 1}열 ${value || '빈 칸'}`);
				if (puzzle[row][column]) cell.classList.add('given');
				if (selected === index) cell.classList.add('selected');
				if (selected !== null && (row === Math.floor(selected / 9) || column === selected % 9 || (Math.floor(row / 3) === Math.floor(Math.floor(selected / 9) / 3) && Math.floor(column / 3) === Math.floor((selected % 9) / 3)))) cell.classList.add('related');
				if (selectedValue && value === selectedValue) cell.classList.add('same-number');
				if (value && puzzle[row][column] === 0 && value !== solution[row][column]) cell.classList.add('error');
				if (value) cell.append(value); else if (notes[index].size) { const noteBox = document.createElement('span'); noteBox.className = 'notes'; for (let number = 1; number <= 9; number++) { const note = document.createElement('span'); note.textContent = notes[index].has(number) ? number : ''; if (notes[index].has(number)) note.className = 'active'; noteBox.append(note); } cell.append(noteBox); }
				cell.addEventListener('click', () => { selected = index; render(); });
				boardElement.append(cell);
			}
			mistakesElement.textContent = `${mistakes} / 3`;
			document.getElementById('hint').textContent = `힌트 하나 받기 · ${hints}회`;
			renderTimer();
		}
		function inputNumber(number) {
			if (selected === null) { setMessage('먼저 빈 칸을 선택해주세요.', 'alert'); return; }
			const row = Math.floor(selected / 9); const column = selected % 9;
			if (puzzle[row][column]) { setMessage('처음부터 있던 숫자는 바꿀 수 없어요.', 'alert'); return; }
			if (noteMode) { notes[selected].has(number) ? notes[selected].delete(number) : notes[selected].add(number); render(); return; }
			entries[row][column] = number; notes[selected].clear();
			if (number !== solution[row][column]) { mistakes++; setMessage('조금 다르게 놓였어요. 다시 생각해볼까요?', 'alert'); } else setMessage('좋아요. 다음 빈 칸을 찾아보세요.');
			render();
			if (mistakes >= 3) { setMessage('실수가 세 번 쌓였어요. 새 퍼즐로 다시 시작해보세요.', 'alert'); clearInterval(timerId); }
			if (entries.every((line, r) => line.every((value, c) => value === solution[r][c]))) { clearInterval(timerId); setMessage(`완성했어요! ${timerElement.textContent} 만에 정원을 채웠습니다.`, 'success'); }
		}
		function erase() { if (selected === null) return; const row = Math.floor(selected / 9); const column = selected % 9; if (!puzzle[row][column]) { entries[row][column] = 0; notes[selected].clear(); render(); setMessage('빈 칸으로 되돌렸어요.'); } }
		document.getElementById('newGame').addEventListener('click', startGame);
		document.getElementById('checkGame').addEventListener('click', () => { const wrong = entries.flat().filter((value, index) => value && value !== solution[Math.floor(index / 9)][index % 9]).length; setMessage(wrong ? `아직 ${wrong}개의 숫자를 다시 살펴보세요.` : '지금까지의 숫자는 모두 맞아요.', wrong ? 'alert' : 'success'); });
		document.getElementById('erase').addEventListener('click', erase);
		document.getElementById('noteMode').addEventListener('click', (event) => { noteMode = !noteMode; event.currentTarget.classList.toggle('active', noteMode); setMessage(noteMode ? '메모 모드예요. 후보 숫자를 표시하세요.' : '입력 모드로 돌아왔어요.'); });
		document.getElementById('hint').addEventListener('click', () => { if (hints <= 0 || selected === null) { setMessage(hints <= 0 ? '힌트를 모두 사용했어요.' : '힌트를 받을 빈 칸을 먼저 선택해주세요.', 'alert'); return; } const row = Math.floor(selected / 9); const column = selected % 9; if (puzzle[row][column]) { setMessage('빈 칸을 선택하면 힌트를 드릴게요.', 'alert'); return; } entries[row][column] = solution[row][column]; notes[selected].clear(); hints--; render(); setMessage('정답 하나를 살짝 밝혀두었어요.', 'success'); });
		difficultyElement.addEventListener('change', startGame);
		document.addEventListener('keydown', (event) => { if (/^[1-9]$/.test(event.key)) inputNumber(Number(event.key)); if (event.key === 'Backspace' || event.key === 'Delete') erase(); });
		for (let number = 1; number <= 9; number++) { const button = document.createElement('button'); button.className = 'number'; button.type = 'button'; button.textContent = number; button.setAttribute('aria-label', `${number} 입력`); button.addEventListener('click', () => inputNumber(number)); padElement.append(button); }
		startGame();
	</script>
</body>
</html>
